  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>

--ink:#0E2F2A; --ground:#F3F6F0; --leaf:#1B6B4F; --water:#2B5E7A; --muted:#44584F; --line:#C9D6CB; --tint:#E2EBE0; --display:'Bricolage Grotesque', system-ui, sans-serif; --body:'Newsreader', Georgia, serif; --mal:'Noto Sans Malayalam', sans-serif; width:100%; box-sizing:border-box; background:var(--ground); color:var(--ink); font-family:var(--body); font-size:19px; line-height:1.55\" data-canvas-width=\"1360\" data-canvas-height=\"5800\">\n\n<!-- HERO -->\n<header style=\"background:var(--ink); color:#F3F6F0\">\n<div style=\"max-width:1180px; margin:0 auto; padding:28px 24px 56px; box-sizing:border-box; display:flex; flex-direction:column; gap:48px\">\n<nav style=\"display:flex; flex-wrap:wrap; gap:12px 28px; justify-content:space-between; align-items:center; font-family:var(--display); font-size:15px; letter-spacing:0.04em\">\n<span style=\"font-weight:700; text-transform:uppercase; letter-spacing:0.14em; font-size:13px\">Kerala Travelogue<\u002Fspan>\n<span style=\"display:flex; flex-wrap:wrap; gap:8px 24px\">\n<a href=\"#route\" style=\"color:#F3F6F0; text-decoration:none\">Route<\u002Fa>\n<a href=\"#table\" style=\"color:#F3F6F0; text-decoration:none\">Table<\u002Fa>\n<a href=\"#season\" style=\"color:#F3F6F0; text-decoration:none\">When to go<\u002Fa>\n<a href=\"#notes\" style=\"color:#F3F6F0; text-decoration:none\">Before you go<\u002Fa>\n<\u002Fspan>\n<\u002Fnav>\n<div style=\"display:flex; flex-wrap:wrap; gap:32px 48px; align-items:flex-end; justify-content:space-between\">\n<div style=\"flex:3 1 480px; min-width:0; display:flex; flex-direction:column; gap:24px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; text-transform:uppercase; letter-spacing:0.16em; color:{{accent}}\">A route through Kerala, south to north<\u002Fspan>\n<h1 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(48px, 8vw, 104px); line-height:0.98; letter-spacing:-0.025em; text-wrap:balance\">Kerala, end to end<\u002Fh1>\n<p style=\"margin:0; max-width:56ch; font-size:21px; color:#D5E1D6\">Two weeks between the Western Ghats and the Arabian Sea, from the temple streets of the capital to the laterite fort at the far north. This is the route, the stops, and what to eat along the way.<\u002Fp>\n<\u002Fdiv>\n<div lang=\"ml\" style=\"flex:1 1 240px; min-width:0; font-family:var(--mal); font-weight:700; font-size:clamp(64px, 12vw, 168px); line-height:1.25; color:{{accent}}; text-align:right\">കേരളം<\u002Fdiv>\n<\u002Fdiv>\n<dl style=\"margin:0; display:flex; flex-wrap:wrap; gap:16px 48px; padding-top:24px; border-top:1px solid #2F5A51; font-family:var(--display)\">\n<div style=\"display:flex; flex-direction:column; gap:2px\"><dt style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#A9BFB2\">Coastline<\u002Fdt><dd style=\"margin:0; font-size:22px; font-weight:700\">590 km<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:2px\"><dt style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#A9BFB2\">Rivers<\u002Fdt><dd style=\"margin:0; font-size:22px; font-weight:700\">44<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:2px\"><dt style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#A9BFB2\">Stops on this route<\u002Fdt><dd style=\"margin:0; font-size:22px; font-weight:700\">8<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:2px\"><dt style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#A9BFB2\">Best months<\u002Fdt><dd style=\"margin:0; font-size:22px; font-weight:700\">October to March<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<\u002Fdiv>\n<!-- kasavu border: off-white cloth with a gold edge -->\n<div style=\"height:18px; background:#F3F6F0; border-top:3px solid {{accent}}; border-bottom:3px solid {{accent}}\"><\u002Fdiv>\n<\u002Fheader>\n\n<main>\n<div style=\"max-width:1180px; margin:0 auto; padding:0 24px; box-sizing:border-box\">\n\n<!-- ROUTE OVERVIEW -->\n<section id=\"route\" style=\"padding-block:72px 24px; display:flex; flex-direction:column; gap:20px\">\n<h2 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px, 4vw, 44px); letter-spacing:-0.015em; line-height:1.1\">The route, in order<\u002Fh2>\n<p style=\"margin:0; max-width:62ch; color:var(--muted)\">The coast comes first, then the hills, then the long way north. Rail covers the coastal stretch. The hill stops are best done by road with a driver.<\u002Fp>\n<ol style=\"margin:8px 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:10px; font-family:var(--display); font-size:15px; font-weight:500\">\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Thiruvananthapuram<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Varkala<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Alappuzha<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Kochi<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Munnar<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Thekkady<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Wayanad<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Kannur and Bekal<\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<!-- CHAPTERS -->\n<section style=\"display:flex; flex-direction:column\">\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 1 · 1 to 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Thiruvananthapuram<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">The capital, in the far south<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">Begin where the state begins. Thiruvananthapuram is a city of red-tiled roofs, old palaces and temple towers, and it moves slower than Kochi. The Padmanabhaswamy Temple anchors the old fort quarter, and the streets around it still sell brass lamps, banana chips and jasmine by the string.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> the Napier Museum and the zoo gardens in the morning, then the sea at Kovalam in the evening. <strong style=\"color:var(--ink)\">Note<\u002Fstrong> that only Hindus may enter the Padmanabhaswamy Temple, and the dress code is strict.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 2 · 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Varkala<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">A cliff above the sea<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">Most of Kerala's coast is flat and palm-fringed. Varkala is the exception, where a red laterite cliff drops straight to Papanasam beach. A path runs along the edge, lined with cafes, and the sea turns copper at sunset. Pilgrims still bathe on the beach below the Janardhana Swamy Temple.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> a late-afternoon walk on the cliff path and an early swim. Currents can be strong, so stay near the lifeguards.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 3 · 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Alappuzha<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">Backwaters and Kuttanad<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">Around Vembanad Lake, canals thread through paddy fields that lie below sea level. Rice is grown here behind earthen bunds, and the water is the road. Kettuvallam houseboats are the famous way to see it, but a small canoe into the narrow channels shows far more: kingfishers, washing steps, toddy shops, children on the way to school.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> a village canoe at dawn. The Nehru Trophy snake boat race is held on Punnamada Lake in August, in the monsoon.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 4 · 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Kochi<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">Fort Kochi and Mattancherry<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">Kochi has been a spice port for centuries, and the layers show. Chinese fishing nets hang over the shore at Fort Kochi, a Portuguese-era church stands a few streets inland, and the Paradesi Synagogue sits in Jew Town among the antique shops and spice warehouses of Mattancherry. Walk it, then cycle it.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> an evening Kathakali performance. Arrive early to watch the make-up being applied, which takes more than an hour.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 5 · 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Munnar<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">Tea country, around 1,500 m<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">The road climbs out of the humid lowlands and the air turns cool. Tea bushes cover the slopes in clipped green waves, and mist settles into the valleys by afternoon. Eravikulam National Park is home to the Nilgiri tahr, a mountain goat found only in the southern Western Ghats. The neelakurinji, a hillside flower, blooms here once every twelve years.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> a tea estate walk and a tasting. Pack a jacket, because evenings are cold. Allow four to five hours by road from Kochi.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 6 · 1 to 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Thekkady<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">Periyar and the spice hills<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">Periyar Tiger Reserve is built around a lake, so the wildlife comes to the water. Elephants are the usual sight, with deer, gaur and many birds. Tigers exist but are rarely seen. Outside the reserve, cardamom, pepper and clove plantations fill the hills around Kumily, and the smell of them reaches the road.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> an early guided walk or a dawn boat trip. Book reserve activities through the forest department, not street touts. Next comes a long travel day north.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 7 · 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Wayanad<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">Forest hills, reached from Kozhikode<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">From Kozhikode the road climbs through hairpin bends into Wayanad, a plateau of coffee, pepper and dense forest. At Edakkal, a climb leads to caves whose walls carry carvings thousands of years old. Villages here are home to Adivasi communities, and many stays are small and family run.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> the Edakkal climb and a slow day on a plantation. Parts of the district were hit by landslides in July 2024, so check local access before you book.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 8 · 2 to 3 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Kannur and Bekal<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">The north Malabar coast<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">The far north is quieter and more ritual than the tourist south. In the cooler months, village shrines around Kannur stage Theyyam, a ceremony where a performer in towering headgear and red-black paint becomes the deity, often through the night. Further up the coast, Bekal Fort stands on a headland of dark laterite above the sea.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> Theyyam if the dates match your trip, and ask your host for the local schedule. Watch quietly from a distance, and ask before you photograph.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fsection>\n\n<!-- PHOTO STRIP -->\n<section style=\"padding-block:64px 16px; display:flex; flex-direction:column; gap:20px\">\n<h2 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px, 4vw, 44px); letter-spacing:-0.015em; line-height:1.1\">From the road<\u002Fh2>\n<p style=\"margin:0; max-width:62ch; color:var(--muted)\">Placeholders for your own photographs. Replace each frame with a picture from the stop it names.<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px\">\n<figure style=\"margin:0; display:flex; flex-direction:column; gap:8px\">\n<div style=\"aspect-ratio:4 / 5; max-width:100%; background:#CFE0D2; display:flex; align-items:center; justify-content:center\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B6B4F\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect><circle cx=\"9\" cy=\"10.5\" r=\"1.6\"><\u002Fcircle><path d=\"M3 17l5-4 4 3 3-2 6 4\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<figcaption style=\"font-family:var(--display); font-size:14px; color:var(--muted)\">Papanasam cliff, Varkala<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin:0; display:flex; flex-direction:column; gap:8px\">\n<div style=\"aspect-ratio:4 / 5; max-width:100%; background:#C4D9E2; display:flex; align-items:center; justify-content:center\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2B5E7A\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect><circle cx=\"9\" cy=\"10.5\" r=\"1.6\"><\u002Fcircle><path d=\"M3 17l5-4 4 3 3-2 6 4\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<figcaption style=\"font-family:var(--display); font-size:14px; color:var(--muted)\">Canal at dawn, Kuttanad<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin:0; display:flex; flex-direction:column; gap:8px\">\n<div style=\"aspect-ratio:4 / 5; max-width:100%; background:#CFE0D2; display:flex; align-items:center; justify-content:center\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1B6B4F\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect><circle cx=\"9\" cy=\"10.5\" r=\"1.6\"><\u002Fcircle><path d=\"M3 17l5-4 4 3 3-2 6 4\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<figcaption style=\"font-family:var(--display); font-size:14px; color:var(--muted)\">Tea slopes, Munnar<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin:0; display:flex; flex-direction:column; gap:8px\">\n<div style=\"aspect-ratio:4 / 5; max-width:100%; background:#C4D9E2; display:flex; align-items:center; justify-content:center\">\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2B5E7A\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect><circle cx=\"9\" cy=\"10.5\" r=\"1.6\"><\u002Fcircle><path d=\"M3 17l5-4 4 3 3-2 6 4\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<figcaption style=\"font-family:var(--display); font-size:14px; color:var(--muted)\">Theyyam, north Malabar<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- TABLE -->\n<section id=\"table\" style=\"padding-block:64px 16px; display:flex; flex-direction:column; gap:24px\">\n<h2 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px, 4vw, 44px); letter-spacing:-0.015em; line-height:1.1\">What to eat on the way<\u002Fh2>\n<p style=\"margin:0; max-width:62ch; color:var(--muted)\">Six plates worth planning a day around, with their Malayalam names to point at on a menu.<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:0 48px\">\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Appam and stew<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">അപ്പം<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Lacy fermented rice pancakes with a mild coconut-milk stew of vegetables or chicken. A Kochi and Kottayam breakfast.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Puttu and kadala<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">പുട്ട്<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Steamed cylinders of rice flour and coconut, served with black chickpea curry. The standard morning meal across the state.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Sadya<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">സദ്യ<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">The vegetarian feast served on a banana leaf, with a dozen or more dishes, eaten with the right hand. Best at Onam, available at good restaurants all year.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Karimeen pollichathu<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">കരിമീൻ<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Pearl spot fish from the backwaters, marinated in spices and roasted in a banana leaf. Eat it in Alappuzha or Kumarakom.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Malabar biryani<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">ബിരിയാണി<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Fragrant short-grain rice layered with spiced meat, cooked sealed on the north coast. Kozhikode and Thalassery argue over who does it best.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Kappa and fish curry<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">കപ്പ<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Mashed tapioca with a red, sour fish curry. Toddy-shop food, plain and strong, and a favourite in the central hills.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SEASON -->\n<section id=\"season\" style=\"padding-block:64px 16px; display:flex; flex-direction:column; gap:24px\">\n<h2 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px, 4vw, 44px); letter-spacing:-0.015em; line-height:1.1\">When to go<\u002Fh2>\n<p style=\"margin:0; max-width:62ch; color:var(--muted)\">Kerala is warm all year. The seasons are set by the two monsoons, so the choice is between dry and comfortable, or green and wet.<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); gap:4px; font-family:var(--display); font-size:12px; font-weight:500; text-align:center\">\n<div style=\"padding:14px 0; background:#1B6B4F; color:#fff\">Jan<\u002Fdiv>\n<div style=\"padding:14px 0; background:#1B6B4F; color:#fff\">Feb<\u002Fdiv>\n<div style=\"padding:14px 0; background:#E8C77A; color:#0E2F2A\">Mar<\u002Fdiv>\n<div style=\"padding:14px 0; background:#E8C77A; color:#0E2F2A\">Apr<\u002Fdiv>\n<div style=\"padding:14px 0; background:#E8C77A; color:#0E2F2A\">May<\u002Fdiv>\n<div style=\"padding:14px 0; background:#2B5E7A; color:#fff\">Jun<\u002Fdiv>\n<div style=\"padding:14px 0; background:#2B5E7A; color:#fff\">Jul<\u002Fdiv>\n<div style=\"padding:14px 0; background:#2B5E7A; color:#fff\">Aug<\u002Fdiv>\n<div style=\"padding:14px 0; background:#2B5E7A; color:#fff\">Sep<\u002Fdiv>\n<div style=\"padding:14px 0; background:#8DB4C6; color:#0E2F2A\">Oct<\u002Fdiv>\n<div style=\"padding:14px 0; background:#8DB4C6; color:#0E2F2A\">Nov<\u002Fdiv>\n<div style=\"padding:14px 0; background:#1B6B4F; color:#fff\">Dec<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:20px 32px; font-size:17px\">\n<div style=\"display:flex; flex-direction:column; gap:4px\"><span style=\"font-family:var(--display); font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px\"><span style=\"width:14px; height:14px; background:#1B6B4F; display:inline-block\"><\u002Fspan>December to February<\u002Fspan><span style=\"color:var(--muted)\">Cool, dry and busy. The best weather for the coast and the hills.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:4px\"><span style=\"font-family:var(--display); font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px\"><span style=\"width:14px; height:14px; background:#E8C77A; display:inline-block\"><\u002Fspan>March to May<\u002Fspan><span style=\"color:var(--muted)\">Hot and humid at sea level. Head uphill to Munnar or Wayanad.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:4px\"><span style=\"font-family:var(--display); font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px\"><span style=\"width:14px; height:14px; background:#2B5E7A; display:inline-block\"><\u002Fspan>June to September<\u002Fspan><span style=\"color:var(--muted)\">The southwest monsoon. Heavy rain, bright green land, quiet backwaters.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:4px\"><span style=\"font-family:var(--display); font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px\"><span style=\"width:14px; height:14px; background:#8DB4C6; display:inline-block\"><\u002Fspan>October and November<\u002Fspan><span style=\"color:var(--muted)\">The northeast monsoon brings afternoon showers. Crowds are thin and Theyyam season begins.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- NOTES -->\n<section id=\"notes\" style=\"padding-block:64px 88px; display:flex; flex-direction:column; gap:24px\">\n<h2 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px, 4vw, 44px); letter-spacing:-0.015em; line-height:1.1\">Before you go<\u002Fh2>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:32px 48px\">\n<div style=\"display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--ink); padding-top:14px\">\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:20px\">Getting around<\u002Fh3>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">One rail line runs down the coast through Thiruvananthapuram, Alappuzha, Ernakulam, Kozhikode, Kannur and Kasaragod. Munnar, Thekkady and Wayanad are reached by road. Hire a driver for the hills, and book trains early in the cool season.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--ink); padding-top:14px\">\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:20px\">Temples and dress<\u002Fh3>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Cover shoulders and knees at temples and remove shoes at the door. Some temples admit only Hindus, and some ask men to remove shirts. Ask at the gate, and carry a light scarf.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--ink); padding-top:14px\">\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:20px\">Houseboats<\u002Fh3>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Kerala Tourism classifies houseboats by grade. Book a registered operator, ask for the registration and grade, and check the route and the meal plan before you pay.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--ink); padding-top:14px\">\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:20px\">Two words of Malayalam<\u002Fh3>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\"><span lang=\"ml\" style=\"font-family:var(--mal); color:var(--ink)\">നമസ്കാരം<\u002Fspan> (namaskaram) is hello, and <span lang=\"ml\" style=\"font-family:var(--mal); color:var(--ink)\">നന്ദി<\u002Fspan> (nanni) is thank you. English is widely understood at tourist stops, but the words land well in villages.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:16px 0 0; font-size:15px; color:var(--muted); max-width:70ch\">Distances, permits, opening hours and road conditions change. Confirm them locally before you travel.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fmain>\n\n<footer style=\"background:var(--ink); color:#D5E1D6\">\n<div style=\"height:18px; background:#F3F6F0; border-top:3px solid {{accent}}; border-bottom:3px solid {{accent}}\"><\u002Fdiv>\n<div style=\"max-width:1180px; margin:0 auto; padding:28px 24px; box-sizing:border-box; display:flex; flex-wrap:wrap; gap:12px 32px; justify-content:space-between; align-items:baseline; font-family:var(--display); font-size:14px\">\n<span style=\"font-weight:700; letter-spacing:0.12em; text-transform:uppercase\">Kerala, end to end<\u002Fspan>\n<span lang=\"ml\" style=\"font-family:var(--mal); font-size:18px; color:{{accent}}\">കേരളം<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div style=\"--ink:#0E2F2A; --ground:#F3F6F0; --leaf:#1B6B4F; --water:#2B5E7A; --muted:#44584F; --line:#C9D6CB; --tint:#E2EBE0; --display:'Bricolage Grotesque', system-ui, sans-serif; --body:'Newsreader', Georgia, serif; --mal:'Noto Sans Malayalam', sans-serif; width:100%; box-sizing:border-box; background:var(--ground); color:var(--ink); font-family:var(--body); font-size:19px; line-height:1.55\" data-canvas-width=\"1360\" data-canvas-height=\"5800\" data-document-role=\"page\" data-label=\"Kerala, end to end\">\n\n\n<header style=\"background:var(--ink); color:#F3F6F0\">\n<div style=\"max-width:1180px; margin:0 auto; padding:28px 24px 56px; box-sizing:border-box; display:flex; flex-direction:column; gap:48px\">\n<nav style=\"display:flex; flex-wrap:wrap; gap:12px 28px; justify-content:space-between; align-items:center; font-family:var(--display); font-size:15px; letter-spacing:0.04em\">\n<span style=\"font-weight:700; text-transform:uppercase; letter-spacing:0.14em; font-size:13px\">Kerala Travelogue<\u002Fspan>\n<span style=\"display:flex; flex-wrap:wrap; gap:8px 24px\">\n<a href=\"#route\" style=\"color:#F3F6F0; text-decoration:none\">Route<\u002Fa>\n<a href=\"#table\" style=\"color:#F3F6F0; text-decoration:none\">Table<\u002Fa>\n<a href=\"#season\" style=\"color:#F3F6F0; text-decoration:none\">When to go<\u002Fa>\n<a href=\"#notes\" style=\"color:#F3F6F0; text-decoration:none\">Before you go<\u002Fa>\n<\u002Fspan>\n<\u002Fnav>\n<div style=\"display:flex; flex-wrap:wrap; gap:32px 48px; align-items:flex-end; justify-content:space-between\">\n<div style=\"flex:3 1 480px; min-width:0; display:flex; flex-direction:column; gap:24px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; text-transform:uppercase; letter-spacing:0.16em; color:#E3B341\">A route through Kerala, south to north<\u002Fspan>\n<h1 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(48px, 8vw, 104px); line-height:0.98; letter-spacing:-0.025em; text-wrap:balance\">Kerala, end to end<\u002Fh1>\n<p style=\"margin:0; max-width:56ch; font-size:21px; color:#D5E1D6\">Two weeks between the Western Ghats and the Arabian Sea, from the temple streets of the capital to the laterite fort at the far north. This is the route, the stops, and what to eat along the way.<\u002Fp>\n<\u002Fdiv>\n<div lang=\"ml\" style=\"flex:1 1 240px; min-width:0; font-family:var(--mal); font-weight:700; font-size:clamp(64px, 12vw, 168px); line-height:1.25; color:#E3B341; text-align:right\">കേരളം<\u002Fdiv>\n<\u002Fdiv>\n<dl style=\"margin:0; display:flex; flex-wrap:wrap; gap:16px 48px; padding-top:24px; border-top:1px solid #2F5A51; font-family:var(--display)\">\n<div style=\"display:flex; flex-direction:column; gap:2px\"><dt style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#A9BFB2\">Coastline<\u002Fdt><dd style=\"margin:0; font-size:22px; font-weight:700\">590 km<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:2px\"><dt style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#A9BFB2\">Rivers<\u002Fdt><dd style=\"margin:0; font-size:22px; font-weight:700\">44<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:2px\"><dt style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#A9BFB2\">Stops on this route<\u002Fdt><dd style=\"margin:0; font-size:22px; font-weight:700\">8<\u002Fdd><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:2px\"><dt style=\"font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:#A9BFB2\">Best months<\u002Fdt><dd style=\"margin:0; font-size:22px; font-weight:700\">October to March<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<\u002Fdiv>\n\n<div style=\"height:18px; background:#F3F6F0; border-top:3px solid #E3B341; border-bottom:3px solid #E3B341\"><\u002Fdiv>\n<\u002Fheader>\n\n<main>\n<div style=\"max-width:1180px; margin:0 auto; padding:0 24px; box-sizing:border-box\">\n\n\n<section id=\"route\" style=\"padding-block:72px 24px; display:flex; flex-direction:column; gap:20px\">\n<h2 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px, 4vw, 44px); letter-spacing:-0.015em; line-height:1.1\">The route, in order<\u002Fh2>\n<p style=\"margin:0; max-width:62ch; color:var(--muted)\">The coast comes first, then the hills, then the long way north. Rail covers the coastal stretch. The hill stops are best done by road with a driver.<\u002Fp>\n<ol style=\"margin:8px 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:10px; font-family:var(--display); font-size:15px; font-weight:500\">\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Thiruvananthapuram<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Varkala<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Alappuzha<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Kochi<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Munnar<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Thekkady<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Wayanad<\u002Fli>\n<li style=\"padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--tint)\">Kannur and Bekal<\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n\n<section style=\"display:flex; flex-direction:column\">\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 1 · 1 to 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Thiruvananthapuram<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">The capital, in the far south<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">Begin where the state begins. Thiruvananthapuram is a city of red-tiled roofs, old palaces and temple towers, and it moves slower than Kochi. The Padmanabhaswamy Temple anchors the old fort quarter, and the streets around it still sell brass lamps, banana chips and jasmine by the string.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> the Napier Museum and the zoo gardens in the morning, then the sea at Kovalam in the evening. <strong style=\"color:var(--ink)\">Note<\u002Fstrong> that only Hindus may enter the Padmanabhaswamy Temple, and the dress code is strict.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 2 · 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Varkala<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">A cliff above the sea<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">Most of Kerala's coast is flat and palm-fringed. Varkala is the exception, where a red laterite cliff drops straight to Papanasam beach. A path runs along the edge, lined with cafes, and the sea turns copper at sunset. Pilgrims still bathe on the beach below the Janardhana Swamy Temple.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> a late-afternoon walk on the cliff path and an early swim. Currents can be strong, so stay near the lifeguards.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 3 · 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Alappuzha<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">Backwaters and Kuttanad<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">Around Vembanad Lake, canals thread through paddy fields that lie below sea level. Rice is grown here behind earthen bunds, and the water is the road. Kettuvallam houseboats are the famous way to see it, but a small canoe into the narrow channels shows far more: kingfishers, washing steps, toddy shops, children on the way to school.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> a village canoe at dawn. The Nehru Trophy snake boat race is held on Punnamada Lake in August, in the monsoon.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 4 · 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Kochi<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">Fort Kochi and Mattancherry<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">Kochi has been a spice port for centuries, and the layers show. Chinese fishing nets hang over the shore at Fort Kochi, a Portuguese-era church stands a few streets inland, and the Paradesi Synagogue sits in Jew Town among the antique shops and spice warehouses of Mattancherry. Walk it, then cycle it.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> an evening Kathakali performance. Arrive early to watch the make-up being applied, which takes more than an hour.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 5 · 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Munnar<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">Tea country, around 1,500 m<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">The road climbs out of the humid lowlands and the air turns cool. Tea bushes cover the slopes in clipped green waves, and mist settles into the valleys by afternoon. Eravikulam National Park is home to the Nilgiri tahr, a mountain goat found only in the southern Western Ghats. The neelakurinji, a hillside flower, blooms here once every twelve years.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> a tea estate walk and a tasting. Pack a jacket, because evenings are cold. Allow four to five hours by road from Kochi.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 6 · 1 to 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Thekkady<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">Periyar and the spice hills<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">Periyar Tiger Reserve is built around a lake, so the wildlife comes to the water. Elephants are the usual sight, with deer, gaur and many birds. Tigers exist but are rarely seen. Outside the reserve, cardamom, pepper and clove plantations fill the hills around Kumily, and the smell of them reaches the road.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> an early guided walk or a dawn boat trip. Book reserve activities through the forest department, not street touts. Next comes a long travel day north.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 7 · 2 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Wayanad<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">Forest hills, reached from Kozhikode<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">From Kozhikode the road climbs through hairpin bends into Wayanad, a plateau of coffee, pepper and dense forest. At Edakkal, a climb leads to caves whose walls carry carvings thousands of years old. Villages here are home to Adivasi communities, and many stays are small and family run.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> the Edakkal climb and a slow day on a plantation. Parts of the district were hit by landslides in July 2024, so check local access before you book.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding-block:44px; display:flex; flex-wrap:wrap; gap:24px 56px\">\n<div style=\"flex:1 1 220px; min-width:0; display:flex; flex-direction:column; gap:8px\">\n<span style=\"font-family:var(--display); font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--leaf)\">Stop 8 · 2 to 3 nights<\u002Fspan>\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:34px; line-height:1.08; letter-spacing:-0.01em\">Kannur and Bekal<\u002Fh3>\n<span style=\"color:var(--muted); font-size:17px\">The north Malabar coast<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:3 1 420px; min-width:0; max-width:64ch; display:flex; flex-direction:column; gap:14px\">\n<p style=\"margin:0\">The far north is quieter and more ritual than the tourist south. In the cooler months, village shrines around Kannur stage Theyyam, a ceremony where a performer in towering headgear and red-black paint becomes the deity, often through the night. Further up the coast, Bekal Fort stands on a headland of dark laterite above the sea.<\u002Fp>\n<p style=\"margin:0; font-size:16px; color:var(--muted)\"><strong style=\"color:var(--ink)\">Go for<\u002Fstrong> Theyyam if the dates match your trip, and ask your host for the local schedule. Watch quietly from a distance, and ask before you photograph.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fsection>\n\n\n<section style=\"padding-block:64px 16px; display:flex; flex-direction:column; gap:20px\">\n<h2 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px, 4vw, 44px); letter-spacing:-0.015em; line-height:1.1\">From the road<\u002Fh2>\n<p style=\"margin:0; max-width:62ch; color:var(--muted)\">Placeholders for your own photographs. Replace each frame with a picture from the stop it names.<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px\">\n<figure style=\"margin:0; display:flex; flex-direction:column; gap:8px\">\n<div style=\"aspect-ratio:4 / 5; max-width:100%; background:#CFE0D2; display:flex; align-items:center; justify-content:center\">\n<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B6B4F\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect><circle cx=\"9\" cy=\"10.5\" r=\"1.6\"><\u002Fcircle><path d=\"M3 17l5-4 4 3 3-2 6 4\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<figcaption style=\"font-family:var(--display); font-size:14px; color:var(--muted)\">Papanasam cliff, Varkala<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin:0; display:flex; flex-direction:column; gap:8px\">\n<div style=\"aspect-ratio:4 / 5; max-width:100%; background:#C4D9E2; display:flex; align-items:center; justify-content:center\">\n<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2B5E7A\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect><circle cx=\"9\" cy=\"10.5\" r=\"1.6\"><\u002Fcircle><path d=\"M3 17l5-4 4 3 3-2 6 4\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<figcaption style=\"font-family:var(--display); font-size:14px; color:var(--muted)\">Canal at dawn, Kuttanad<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin:0; display:flex; flex-direction:column; gap:8px\">\n<div style=\"aspect-ratio:4 / 5; max-width:100%; background:#CFE0D2; display:flex; align-items:center; justify-content:center\">\n<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1B6B4F\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect><circle cx=\"9\" cy=\"10.5\" r=\"1.6\"><\u002Fcircle><path d=\"M3 17l5-4 4 3 3-2 6 4\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<figcaption style=\"font-family:var(--display); font-size:14px; color:var(--muted)\">Tea slopes, Munnar<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin:0; display:flex; flex-direction:column; gap:8px\">\n<div style=\"aspect-ratio:4 / 5; max-width:100%; background:#C4D9E2; display:flex; align-items:center; justify-content:center\">\n<svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2B5E7A\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"1\"><\u002Frect><circle cx=\"9\" cy=\"10.5\" r=\"1.6\"><\u002Fcircle><path d=\"M3 17l5-4 4 3 3-2 6 4\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<figcaption style=\"font-family:var(--display); font-size:14px; color:var(--muted)\">Theyyam, north Malabar<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"table\" style=\"padding-block:64px 16px; display:flex; flex-direction:column; gap:24px\">\n<h2 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px, 4vw, 44px); letter-spacing:-0.015em; line-height:1.1\">What to eat on the way<\u002Fh2>\n<p style=\"margin:0; max-width:62ch; color:var(--muted)\">Six plates worth planning a day around, with their Malayalam names to point at on a menu.<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:0 48px\">\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Appam and stew<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">അപ്പം<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Lacy fermented rice pancakes with a mild coconut-milk stew of vegetables or chicken. A Kochi and Kottayam breakfast.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Puttu and kadala<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">പുട്ട്<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Steamed cylinders of rice flour and coconut, served with black chickpea curry. The standard morning meal across the state.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Sadya<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">സദ്യ<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">The vegetarian feast served on a banana leaf, with a dozen or more dishes, eaten with the right hand. Best at Onam, available at good restaurants all year.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Karimeen pollichathu<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">കരിമീൻ<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Pearl spot fish from the backwaters, marinated in spices and roasted in a banana leaf. Eat it in Alappuzha or Kumarakom.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Malabar biryani<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">ബിരിയാണി<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Fragrant short-grain rice layered with spiced meat, cooked sealed on the north coast. Kozhikode and Thalassery argue over who does it best.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"padding-block:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:4px\">\n<div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px\"><h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:22px\">Kappa and fish curry<\u002Fh3><span lang=\"ml\" style=\"font-family:var(--mal); font-size:17px; color:var(--leaf)\">കപ്പ<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Mashed tapioca with a red, sour fish curry. Toddy-shop food, plain and strong, and a favourite in the central hills.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"season\" style=\"padding-block:64px 16px; display:flex; flex-direction:column; gap:24px\">\n<h2 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px, 4vw, 44px); letter-spacing:-0.015em; line-height:1.1\">When to go<\u002Fh2>\n<p style=\"margin:0; max-width:62ch; color:var(--muted)\">Kerala is warm all year. The seasons are set by the two monsoons, so the choice is between dry and comfortable, or green and wet.<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); gap:4px; font-family:var(--display); font-size:12px; font-weight:500; text-align:center\">\n<div style=\"padding:14px 0; background:#1B6B4F; color:#fff\">Jan<\u002Fdiv>\n<div style=\"padding:14px 0; background:#1B6B4F; color:#fff\">Feb<\u002Fdiv>\n<div style=\"padding:14px 0; background:#E8C77A; color:#0E2F2A\">Mar<\u002Fdiv>\n<div style=\"padding:14px 0; background:#E8C77A; color:#0E2F2A\">Apr<\u002Fdiv>\n<div style=\"padding:14px 0; background:#E8C77A; color:#0E2F2A\">May<\u002Fdiv>\n<div style=\"padding:14px 0; background:#2B5E7A; color:#fff\">Jun<\u002Fdiv>\n<div style=\"padding:14px 0; background:#2B5E7A; color:#fff\">Jul<\u002Fdiv>\n<div style=\"padding:14px 0; background:#2B5E7A; color:#fff\">Aug<\u002Fdiv>\n<div style=\"padding:14px 0; background:#2B5E7A; color:#fff\">Sep<\u002Fdiv>\n<div style=\"padding:14px 0; background:#8DB4C6; color:#0E2F2A\">Oct<\u002Fdiv>\n<div style=\"padding:14px 0; background:#8DB4C6; color:#0E2F2A\">Nov<\u002Fdiv>\n<div style=\"padding:14px 0; background:#1B6B4F; color:#fff\">Dec<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:20px 32px; font-size:17px\">\n<div style=\"display:flex; flex-direction:column; gap:4px\"><span style=\"font-family:var(--display); font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px\"><span style=\"width:14px; height:14px; background:#1B6B4F; display:inline-block\"><\u002Fspan>December to February<\u002Fspan><span style=\"color:var(--muted)\">Cool, dry and busy. The best weather for the coast and the hills.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:4px\"><span style=\"font-family:var(--display); font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px\"><span style=\"width:14px; height:14px; background:#E8C77A; display:inline-block\"><\u002Fspan>March to May<\u002Fspan><span style=\"color:var(--muted)\">Hot and humid at sea level. Head uphill to Munnar or Wayanad.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:4px\"><span style=\"font-family:var(--display); font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px\"><span style=\"width:14px; height:14px; background:#2B5E7A; display:inline-block\"><\u002Fspan>June to September<\u002Fspan><span style=\"color:var(--muted)\">The southwest monsoon. Heavy rain, bright green land, quiet backwaters.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:4px\"><span style=\"font-family:var(--display); font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px\"><span style=\"width:14px; height:14px; background:#8DB4C6; display:inline-block\"><\u002Fspan>October and November<\u002Fspan><span style=\"color:var(--muted)\">The northeast monsoon brings afternoon showers. Crowds are thin and Theyyam season begins.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"notes\" style=\"padding-block:64px 88px; display:flex; flex-direction:column; gap:24px\">\n<h2 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px, 4vw, 44px); letter-spacing:-0.015em; line-height:1.1\">Before you go<\u002Fh2>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:32px 48px\">\n<div style=\"display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--ink); padding-top:14px\">\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:20px\">Getting around<\u002Fh3>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">One rail line runs down the coast through Thiruvananthapuram, Alappuzha, Ernakulam, Kozhikode, Kannur and Kasaragod. Munnar, Thekkady and Wayanad are reached by road. Hire a driver for the hills, and book trains early in the cool season.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--ink); padding-top:14px\">\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:20px\">Temples and dress<\u002Fh3>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Cover shoulders and knees at temples and remove shoes at the door. Some temples admit only Hindus, and some ask men to remove shirts. Ask at the gate, and carry a light scarf.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--ink); padding-top:14px\">\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:20px\">Houseboats<\u002Fh3>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\">Kerala Tourism classifies houseboats by grade. Book a registered operator, ask for the registration and grade, and check the route and the meal plan before you pay.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex; flex-direction:column; gap:8px; border-top:3px solid var(--ink); padding-top:14px\">\n<h3 style=\"margin:0; font-family:var(--display); font-weight:700; font-size:20px\">Two words of Malayalam<\u002Fh3>\n<p style=\"margin:0; font-size:17px; color:var(--muted)\"><span lang=\"ml\" style=\"font-family:var(--mal); color:var(--ink)\">നമസ്കാരം<\u002Fspan> (namaskaram) is hello, and <span lang=\"ml\" style=\"font-family:var(--mal); color:var(--ink)\">നന്ദി<\u002Fspan> (nanni) is thank you. English is widely understood at tourist stops, but the words land well in villages.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:16px 0 0; font-size:15px; color:var(--muted); max-width:70ch\">Distances, permits, opening hours and road conditions change. Confirm them locally before you travel.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fmain>\n\n<footer style=\"background:var(--ink); color:#D5E1D6\">\n<div style=\"height:18px; background:#F3F6F0; border-top:3px solid #E3B341; border-bottom:3px solid #E3B341\"><\u002Fdiv>\n<div style=\"max-width:1180px; margin:0 auto; padding:28px 24px; box-sizing:border-box; display:flex; flex-wrap:wrap; gap:12px 32px; justify-content:space-between; align-items:baseline; font-family:var(--display); font-size:14px\">\n<span style=\"font-weight:700; letter-spacing:0.12em; text-transform:uppercase\">Kerala, end to end<\u002Fspan>\n<span lang=\"ml\" style=\"font-family:var(--mal); font-size:18px; color:#E3B341\">കേരളം<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E3B341&quot;},&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:5800}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#E3B341' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
